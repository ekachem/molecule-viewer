<!DOCTYPE html>
<html>
<head>
    <title>SMILES Viewer</title>
    <!-- Use the full path to the library file below -->
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        canvas { border: 1px solid #ddd; margin-top: 20px; background: #fff; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>SMILES Molecule Viewer</h1>
    <input type="text" id="smiles-input" placeholder="Enter SMILES (e.g. CCO)" value="C1CCCCC1">
    <button onclick="draw()">Draw Molecule</button>
    <br>
    <canvas id="molecule-canvas" width="400" height="400"></canvas>

    <script>
        // Initialize the drawer with specific options
        const options = { width: 400, height: 400 };
        const smilesDrawer = new SmilesDrawer.Drawer(options);

        function draw() {
            const input = document.getElementById('smiles-input').value;

            // Use the static parse method from the library
            SmilesDrawer.parse(input, function(tree) {
                // Draw the parsed molecule tree to the canvas
                smilesDrawer.draw(tree, 'molecule-canvas', 'light', false);
            }, function(err) {
                console.error("SMILES Error:", err);
                alert("Invalid SMILES string");
            });
        }

        // Render the default molecule (cyclohexane) when the page loads
        window.onload = draw;
    </script>
</body>
</html>
