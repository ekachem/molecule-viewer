<!DOCTYPE html>
<html>
<head>
    <title>SMILES 2D/3D Viewer</title>
    <!-- 2D Library -->
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
    <!-- 3D Library (jQuery is a dependency for 3Dmol) -->
    <script src="https://code.jquery.com"></script>
    <script src="https://3dmol.csb.pitt.edu"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; min-width: 550px; }
        .viewer-container { position: relative; width: 500px; height: 500px; margin: 20px auto; border: 1px solid #ddd; }
        canvas, #gldiv { width: 100%; height: 100%; }
        #gldiv { display: none; } /* Hidden by default */
        .controls { margin-bottom: 15px; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
        .btn-draw { background: #28a745; color: white; }
        .btn-toggle { background: #007bff; color: white; margin-top: 10px; }
        .active { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>Molecule Viewer</h1>
    
    <div class="controls">
        <select id="molecule-select" onchange="updateFromSelect()">
            <option value="">-- Quick Examples --</option>
            <option value="C1CCCCC1">Cyclohexane</option>
            <option value="CN1C=NC2=C1C(=O)N(C(=O)N2C)C">Caffeine</option>
            <option value="CC(=O)OC1=CC=CC=C1C(=O)O">Aspirin</option>
            <option value="C1=CC=C(C=C1)C=O">Benzaldehyde</option>
        </select>
        <input type="text" id="smiles-input" placeholder="Enter SMILES" value="C1CCCCC1">
        <button class="btn-draw" onclick="render()">Update</button>
    </div>

    <div>
        <button id="view-mode-btn" class="btn-toggle" onclick="toggleMode()">Switch to 3D View</button>
    </div>

    <div class="viewer-container">
        <!-- 2D Canvas -->
        <canvas id="molecule-canvas"></canvas>
        <!-- 3D Container -->
        <div id="gldiv"></div>
    </div>
</div>

<script>
    let is3D = false;
    const options = { width: 500, height: 500 };
    const smilesDrawer = new SmilesDrawer.Drawer(options);

    function updateFromSelect() {
        const select = document.getElementById('molecule-select');
        if (select.value) {
            document.getElementById('smiles-input').value = select.value;
            render();
        }
    }

    function toggleMode() {
        is3D = !is3D;
        document.getElementById('molecule-canvas').style.display = is3D ? 'none' : 'block';
        document.getElementById('gldiv').style.display = is3D ? 'block' : 'none';
        document.getElementById('view-mode-btn').innerText = is3D ? 'Switch to 2D View' : 'Switch to 3D View';
        render();
    }

    function render() {
        const smiles = document.getElementById('smiles-input').value;
        if (is3D) {
            render3D(smiles);
        } else {
            render2D(smiles);
        }
    }

    function render2D(smiles) {
        SmilesDrawer.parse(smiles, function(tree) {
            smilesDrawer.draw(tree, 'molecule-canvas', 'light', false);
        });
    }

    function render3D(smiles) {
        const encodedSmiles = encodeURIComponent(smiles);
        const url = `https://cactus.nci.nih.gov{encodedSmiles}/file?format=sdf&get3d=true`;

        let element = $('#gldiv');
        let viewer = $3Dmol.createViewer(element, { backgroundColor: 'white' });

        $.get(url, function(data) {
            viewer.addModel(data, "sdf");
            viewer.setStyle({}, { stick: { radius: 0.2 }, sphere: { scale: 0.3 } });
            viewer.zoomTo();
            viewer.render();
        }).fail(function() {
            alert("Could not generate 3D structure for this SMILES.");
        });
    }

    // Initial Load
    window.onload = render;
</script>

</body>
</html>
