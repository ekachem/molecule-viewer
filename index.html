<!DOCTYPE html>
<html>
<head>
    <title>SMILES 2D/3D Viewer</title>
    <script src="https://unpkg.com/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.5.3/3Dmol-min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; min-width: 550px; }
        .viewer-container { position: relative; width: 500px; height: 500px; margin: 20px auto; border: 1px solid #ddd; }
        canvas, #gldiv { width: 100%; height: 100%; }
        #gldiv { display: none; }
        .controls { margin-bottom: 15px; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
        .btn-draw { background: #28a745; color: white; }
        .btn-toggle { background: #007bff; color: white; margin-top: 10px; }
        
        /* New Info Section Styling */
        #info-panel { margin-top: 15px; padding: 15px; background: #fafafa; border-radius: 8px; text-align: left; border: 1px solid #eee; }
        .info-label { font-weight: bold; color: #555; }
        .info-value { color: #000; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Molecule Viewer</h1>
    
    <div class="controls">
        <select id="molecule-select" onchange="updateFromSelect()">
            <!-- Options injected here -->
        </select>
        <input type="text" id="smiles-input" placeholder="Enter SMILES" value="C1CCCCC1">
        <button class="btn-draw" onclick="render()">Update</button>
    </div>

    <div>
        <button id="view-mode-btn" class="btn-toggle" onclick="toggleMode()">Switch to 3D View</button>
    </div>

    <div class="viewer-container">
        <canvas id="molecule-canvas"></canvas>
        <div id="gldiv"></div>
    </div>

    <!-- NEW: Info Panel -->
    <div id="info-panel">
    <div><span class="info-label">IUPAC Name:</span> <span id="iupac-name" class="info-value">Searching...</span></div>
    <div><span class="info-label">Common Names:</span> <span id="common-names" class="info-value">-</span></div>
    <div><span class="info-label">Formula:</span> <span id="mol-formula" class="info-value">-</span></div>
    <div><span class="info-label">Mol. Weight:</span> <span id="mol-weight" class="info-value">-</span></div>
</div>
</div>

<script>
    let is3D = false;
    const options = { width: 500, height: 500 };
    const smilesDrawer = new SmilesDrawer.Drawer(options);

    function updateFromSelect() {
        const select = document.getElementById('molecule-select');
        if (select.value) {
            document.getElementById('smiles-input').value = select.value;
            render();
        }
    }

    function toggleMode() {
        is3D = !is3D;
        document.getElementById('molecule-canvas').style.display = is3D ? 'none' : 'block';
        document.getElementById('gldiv').style.display = is3D ? 'block' : 'none';
        document.getElementById('view-mode-btn').innerText = is3D ? 'Switch to 2D View' : 'Switch to 3D View';
        render();
    }

    // UPDATED: Now calls fetchPubChemData
    function render() {
        const smiles = document.getElementById('smiles-input').value;
        fetchPubChemData(smiles); // Get info
        
        if (is3D) {
            render3D(smiles);
        } else {
            render2D(smiles);
        }
    }

    // NEW: Fetching logic from PubChem
async function fetchPubChemData(smiles) {
    const encodedSmiles = encodeURIComponent(smiles);
    
    // Reset displays
    document.getElementById('iupac-name').innerText = "Searching...";
    document.getElementById('common-names').innerText = "Searching...";

    // 1. Fetch Properties (IUPAC, Formula, Weight)
    const propUrl = `https://pubchem.ncbi.nlm.nih.gov{encodedSmiles}/property/IUPACName,MolecularFormula,MolecularWeight/JSON`;
    
    // 2. Fetch Synonyms (Common/Commercial names)
    const synUrl = `https://pubchem.ncbi.nlm.nih.gov{encodedSmiles}/synonyms/JSON`;

    try {
        // Run both requests in parallel for speed
        const [propRes, synRes] = await Promise.all([
            fetch(propUrl).then(res => res.json()),
            fetch(synUrl).then(res => res.json())
        ]);

        // Handle Properties
        if (propRes.PropertyTable && propRes.PropertyTable.Properties) {
            const props = propRes.PropertyTable.Properties[0];
            document.getElementById('iupac-name').innerText = props.IUPACName || "N/A";
            document.getElementById('mol-formula').innerText = props.MolecularFormula || "N/A";
            document.getElementById('mol-weight').innerText = props.MolecularWeight || "N/A";
        }

        // Handle Synonyms (Common Names)
        if (synRes.InformationList && synRes.InformationList.Information) {
            const synonyms = synRes.InformationList.Information[0].Synonym;
            if (synonyms && synonyms.length > 0) {
                // We take the first 3 common synonyms and join them
                const topSynonyms = synonyms.slice(0, 3).join(", ");
                document.getElementById('common-names').innerText = topSynonyms;
            } else {
                document.getElementById('common-names').innerText = "None found";
            }
        }

    } catch (err) {
        document.getElementById('iupac-name').innerText = "Not found";
        document.getElementById('common-names').innerText = "Not found";
        console.error("PubChem Fetch Error:", err);
    }
}

// Update the render function to call the fetcher
function render() {
    const smiles = document.getElementById('smiles-input').value;
    if (!smiles) return;

    fetchPubChemData(smiles);
    
    if (is3D) {
        render3D(smiles);
    } else {
        render2D(smiles);
    }
}

    function render2D(smiles) {
        SmilesDrawer.parse(smiles, function(tree) {
            smilesDrawer.draw(tree, 'molecule-canvas', 'light', false);
        });
    }

    function render3D(smiles) {
        const encodedSmiles = encodeURIComponent(smiles);
        const url = `https://cactus.nci.nih.gov{encodedSmiles}/file?format=sdf&get3d=true`;
        let element = $('#gldiv');
        let viewer = $3Dmol.createViewer(element, { backgroundColor: 'white' });

        $.get(url, function(data) {
            viewer.addModel(data, "sdf");
            viewer.setStyle({}, { stick: { radius: 0.2 }, sphere: { scale: 0.3 } });
            viewer.zoomTo();
            viewer.render();
        }).fail(function() {
            console.warn("3D fetch failed.");
        });
    }

    window.onload = function() {
        // Mocking the loadMolecules for demo purposes
        const select = document.getElementById('molecule-select');
        const demoMols = [{name: "Benzene", smiles: "c1ccccc1"}, {name: "Caffeine", smiles: "CN1C=NC2=C1C(=O)N(C(=O)N2C)C"}];
        demoMols.forEach(mol => {
            let opt = document.createElement('option');
            opt.value = mol.smiles;
            opt.innerHTML = mol.name;
            select.appendChild(opt);
        });
        render();
    };
</script>
</body>
</html>
